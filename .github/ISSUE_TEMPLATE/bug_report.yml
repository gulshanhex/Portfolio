name: Bug Report
description: Report a bug or regression in the public portfolio or /admin CMS
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Before submitting, please verify that this is not a security vulnerability (report security issues privately per [SECURITY.md](../../SECURITY.md)).
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Public Portfolio Page (/)
        - Detail Pages (/services/[slug] or /work/[slug])
        - Admin Panel (/admin)
        - Admin or Contact API (/api/*)
        - Cloudflare Worker / D1 Schema
        - PWA / Service Worker
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / Node / Wrangler Environment
      placeholder: "e.g. Chrome 130 on macOS, Node 22.x, Wrangler 4.x"
